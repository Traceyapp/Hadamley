<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fibromyalgia tender-point areas (1990 classification criteria)</title>
<desc id="d">Front and back outlines of a body showing nine paired areas, eighteen points in total: occiput, low cervical, trapezius, supraspinatus, second rib, lateral epicondyle, gluteal, greater trochanter and knee. Historical classification criteria, not a diagnostic or self-test tool.</desc>
<rect width="1000" height="840" fill="#ffffff"/>
<rect x="1" y="1" width="998" height="838" rx="18" fill="none" stroke="#c9a96e" stroke-width="2"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#142a52">Tender-point areas: 1990 classification criteria</text>
<g transform="translate(0,80)">

<line x1="390" y1="138" x2="362" y2="362" stroke="#1b3a6b" stroke-width="30" stroke-linecap="round"/><line x1="550" y1="138" x2="578" y2="362" stroke="#1b3a6b" stroke-width="30" stroke-linecap="round"/><line x1="436" y1="340" x2="430" y2="592" stroke="#1b3a6b" stroke-width="38" stroke-linecap="round"/><line x1="504" y1="340" x2="510" y2="592" stroke="#1b3a6b" stroke-width="38" stroke-linecap="round"/><line x1="390" y1="138" x2="362" y2="362" stroke="#f8f3e8" stroke-width="26" stroke-linecap="round"/><line x1="550" y1="138" x2="578" y2="362" stroke="#f8f3e8" stroke-width="26" stroke-linecap="round"/><line x1="436" y1="340" x2="430" y2="592" stroke="#f8f3e8" stroke-width="34" stroke-linecap="round"/><line x1="504" y1="340" x2="510" y2="592" stroke="#f8f3e8" stroke-width="34" stroke-linecap="round"/><path d="M452,104 L488,104 L490,122 Q554,126 556,150 L530,282 Q544,320 542,352 Q470,372 398,352 Q396,320 410,282 L384,150 Q386,126 450,122 Z" fill="#f8f3e8" stroke="#1b3a6b" stroke-width="2"/><circle cx="470" cy="66" r="36" fill="#f8f3e8" stroke="#1b3a6b" stroke-width="2"/><text x="470" y="640" text-anchor="middle" font-size="22" font-weight="700" fill="#142a52">Back</text>

<circle cx="432" cy="330" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="432" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">7</text><circle cx="406" cy="366" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="406" y="371" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">8</text><circle cx="485" cy="100" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="485" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">1</text><circle cx="518" cy="134" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="518" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">3</text><circle cx="510" cy="166" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="510" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">4</text><circle cx="508" cy="330" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="508" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">7</text><circle cx="534" cy="366" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="534" y="371" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">8</text>
</g>
<text x="640" y="118" font-size="14" font-weight="700" fill="#8a6a2f" letter-spacing="1.2">EACH AREA IS ON BOTH SIDES</text><text x="640" y="138" font-size="14" fill="#8a6a2f">9 areas, 18 points in total</text>
<circle cx="640" cy="183" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="640" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">1</text><text x="664" y="182" font-size="17" font-weight="700" fill="#142a52">Occiput</text><text x="664" y="202" font-size="14" fill="#4b5772">base of the skull, at the back</text><circle cx="640" cy="235" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="640" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">2</text><text x="664" y="234" font-size="17" font-weight="700" fill="#142a52">Low cervical</text><text x="664" y="254" font-size="14" fill="#4b5772">lower front of the neck</text><circle cx="640" cy="287" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="640" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">3</text><text x="664" y="286" font-size="17" font-weight="700" fill="#142a52">Trapezius</text><text x="664" y="306" font-size="14" fill="#4b5772">top of the shoulder</text><circle cx="640" cy="339" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="640" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">4</text><text x="664" y="338" font-size="17" font-weight="700" fill="#142a52">Supraspinatus</text><text x="664" y="358" font-size="14" fill="#4b5772">above the shoulder blade</text><circle cx="640" cy="391" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="640" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">5</text><text x="664" y="390" font-size="17" font-weight="700" fill="#142a52">Second rib</text><text x="664" y="410" font-size="14" fill="#4b5772">upper chest, beside the breastbone</text><circle cx="640" cy="443" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="640" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">6</text><text x="664" y="442" font-size="17" font-weight="700" fill="#142a52">Lateral epicondyle</text><text x="664" y="462" font-size="14" fill="#4b5772">just below the outer elbow</text><circle cx="640" cy="495" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="640" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">7</text><text x="664" y="494" font-size="17" font-weight="700" fill="#142a52">Gluteal</text><text x="664" y="514" font-size="14" fill="#4b5772">upper outer buttock</text><circle cx="640" cy="547" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="640" y="552" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">8</text><text x="664" y="546" font-size="17" font-weight="700" fill="#142a52">Greater trochanter</text><text x="664" y="566" font-size="14" fill="#4b5772">outer hip, just behind the bony point</text><circle cx="640" cy="599" r="12" fill="#c9a96e" stroke="#1b3a6b" stroke-width="2"/><text x="640" y="604" text-anchor="middle" font-size="14" font-weight="700" fill="#142a52">9</text><text x="664" y="598" font-size="17" font-weight="700" fill="#142a52">Knee</text><text x="664" y="618" font-size="14" fill="#4b5772">inner side of the knee, just above the joint</text>
<line x1="40" y1="752" x2="960" y2="752" stroke="#c9a96e" stroke-width="1.5"/>
<text x="40" y="780" font-size="15" fill="#142a52">Numbers mark areas, not a score. Positions are approximate. Modern diagnosis does not need a tender-point count,</text>
<text x="40" y="802" font-size="15" fill="#142a52">and this is not a self-test. Draft for clinical review. Hadamley Information Services | Free Independent Resources</text>
</svg>
